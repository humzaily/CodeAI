<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Islamic Companion</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F4EFE4;color:#0E1A2B}
    #load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .box{max-width:520px;background:#FCFAF3;border:1px solid rgba(201,162,75,.35);border-radius:18px;padding:28px;box-shadow:0 18px 40px -24px rgba(14,26,43,.6)}
    h1{margin:0 0 8px;font-family:Georgia,serif;font-weight:500}
    p{line-height:1.55}a{color:#0E1A2B;font-weight:700}
  </style>
</head>
<body>
  <div id="load">
    <div class="box">
      <h1>Islamic Companion</h1>
      <p>Opening the lesson…</p>
      <p id="fallback" hidden>The interactive page could not open in this browser. <a href="https://drive.google.com/file/d/13kmzq9FNAAmZs8us9eOsJ1i-XwizUOuT/view?usp=sharing">Open the Drive copy</a>.</p>
    </div>
  </div>
  <script>
  (async()=>{
    try{
      if(!('DecompressionStream' in window)) throw new Error('This browser does not support decompression.');
      const files=['payload/0.txt','payload/1.txt','payload/2.txt','payload/3.txt','payload/4.txt','payload/5.txt','payload/6.txt'];
      const parts=await Promise.all(files.map((url,index)=>fetch(url+'?v=20260720d').then(response=>{
        if(!response.ok) throw new Error('Could not load lesson part '+(index+1));
        return response.text();
      })));
      const encoded=parts.join('').replace(/\s/g,'');
      const compressed=Uint8Array.from(atob(encoded),character=>character.charCodeAt(0));
      const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      if(!/^\s*<!doctype html>/i.test(html)) throw new Error('The lesson file is invalid.');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      console.error(error);
      document.getElementById('fallback').hidden=false;
    }
  })();
  </script>
</body>
</html>
