<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Islamic Companion</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F4EFE4;color:#0E1A2B;}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;}
    .box{max-width:520px;background:#FCFAF3;border:1px solid rgba(201,162,75,.35);border-radius:18px;padding:28px;box-shadow:0 18px 40px -24px rgba(14,26,43,.6)}
    h1{margin:0 0 8px;font-family:Georgia,serif;font-weight:500}.muted{color:#66717f}.btn{display:inline-block;margin:8px;padding:11px 18px;border-radius:10px;background:#0E1A2B;color:white;text-decoration:none;font-weight:700}.btn.alt{background:#C9A24B;color:#211900}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="box">
      <h1>Islamic Companion</h1>
      <p class="muted">Opening the page...</p>
      <p id="fallback" style="display:none">
        If it does not load, open it here:<br>
        <a class="btn" href="https://drive.google.com/file/d/13kmzq9FNAAmZs8us9eOsJ1i-XwizUOuT/view?usp=sharing">Open Drive version</a>
        <a class="btn alt" href="https://drive.google.com/uc?export=download&id=13kmzq9FNAAmZs8us9eOsJ1i-XwizUOuT">Download HTML</a>
      </p>
    </div>
  </div>
  <script>
    const driveDownload = 'https://drive.google.com/uc?export=download&id=13kmzq9FNAAmZs8us9eOsJ1i-XwizUOuT';
    const proxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(driveDownload);
    setTimeout(() => { document.getElementById('fallback').style.display = 'block'; }, 6000);
    fetch(proxy)
      .then(r => {
        if (!r.ok) throw new Error('Could not load file');
        return r.text();
      })
      .then(html => {
        if (!html.trim().toLowerCase().startsWith('<!doctype') && !html.trim().toLowerCase().startsWith('<html')) throw new Error('Unexpected file response');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.getElementById('fallback').style.display = 'block';
      });
  </script>
</body>
</html>
